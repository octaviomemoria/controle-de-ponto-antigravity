name: Monitor Production

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: https://controle-de-ponto-antigravity.vercel.app
    steps:
      - name: Check health
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            "${PRODUCTION_URL}/api/health"

      - name: Check readiness
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            "${PRODUCTION_URL}/api/ready"
